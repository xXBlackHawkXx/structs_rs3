name: Build and deploy cache viewer

on:
  workflow_dispatch:
    inputs:
      dump_ref:
        description: Cache dump branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Change this if the viewer lives in a subdirectory of your repository.
  PROJECT_DIR: .
  DUMP_REF: ${{ inputs.dump_ref || 'master' }}
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Retain validated comparison inputs; bot pushes do not start another run.
      contents: write
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Check GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Test comparison generator and importer
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m unittest discover -s tests -v

      - name: Refresh revision history
        id: refresh
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m pipeline.refresh --ref "$DUMP_REF" --pages-url "$PAGES_URL" --github-output "$GITHUB_OUTPUT" --force

      - name: Set up Node for frontend checks
        if: steps.refresh.outputs.build == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Check frontend syntax
        if: steps.refresh.outputs.build == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          node --check frontend/structs.js

      - name: Build compressed static site
        if: steps.refresh.outputs.build == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.refresh.outputs.revision }}
        run: python -m builder.build --ref "$REVISION" --pipeline-state .cache/pipeline/state.json --compress-json

      - name: Test generated site
        if: steps.refresh.outputs.build == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --prefix .cache/frontend-check --no-save --ignore-scripts jsdom@29.1.1
          node tests/test_frontend.cjs --smoke

      - name: Check published size
        if: steps.refresh.outputs.build == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('dist')
          size = sum(path.stat().st_size for path in root.rglob('*') if path.is_file())
          print(f'Published site: {size:,} bytes ({size / 2**20:.1f} MiB)')
          if size >= 1_000_000_000:
              raise SystemExit('Generated site exceeds the GitHub Pages 1 GB limit.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Published site size: **{size / 2**20:.1f} MiB**\n')
          PY

      - name: Retain validated revision history
        if: steps.refresh.outputs.history_changed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISION: ${{ steps.refresh.outputs.revision }}
        run: |
          git add -- "$PROJECT_DIR/history/manifest.json" "$PROJECT_DIR/history/reports"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update cache history for $REVISION"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi

      - name: Upload Pages artifact
        if: steps.refresh.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ env.PROJECT_DIR }}/dist
    outputs:
      publish: ${{ steps.refresh.outputs.build }}

  deploy:
    if: needs.build.outputs.publish == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
