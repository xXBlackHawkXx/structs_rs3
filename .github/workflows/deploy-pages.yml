name: Build and deploy cache viewer

on:
  push:
  workflow_dispatch:
    inputs:
      dump_ref:
        description: Cache dump branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Change this if the viewer lives in a subdirectory of your repository.
  PROJECT_DIR: .
  DUMP_REF: ${{ inputs.dump_ref || 'master' }}
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'

      - name: Set up Node for frontend checks
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v6.0.0

      - name: Test importer and frontend syntax
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m unittest discover -s tests -v
          node --check frontend/structs.js

      - name: Build compressed static site
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m builder.build --ref "$DUMP_REF" --compress-json

      - name: Test generated site
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --prefix .cache/frontend-check --no-save --ignore-scripts jsdom@29.1.1
          node tests/test_frontend.cjs --smoke

      - name: Check published size
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path('dist')
          size = sum(path.stat().st_size for path in root.rglob('*') if path.is_file())
          print(f'Published site: {size:,} bytes ({size / 2**20:.1f} MiB)')
          if size >= 1_000_000_000:
              raise SystemExit('Generated site exceeds the GitHub Pages 1 GB limit.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Published site size: **{size / 2**20:.1f} MiB**\n')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
